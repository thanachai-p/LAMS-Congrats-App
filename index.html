<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="description" content="ระบบสร้างภาพโปสเตอร์แสดงความยินดี คณะศิลปศาสตร์และวิทยาการจัดการ ม.อ." />
  <title>ระบบสร้างภาพโปสเตอร์แสดงความยินดี | PSU LAMS</title>

  <style>
    :root {
      --psu-navy: #003b70;
      --psu-navy-dark: #002a50;
      --white: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.85);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--psu-navy);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Loading Screen สไตล์ PSU Navy พรีเมียม */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--white);
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.08) 0%, rgba(0, 59, 112, 1) 68%);
      opacity: 1;
      visibility: visible;
      transition: opacity 240ms ease, visibility 240ms ease;
    }

    #loading-screen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(100%, 420px);
      padding: 36px 24px;
      text-align: center;
    }

    .brand-mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      color: var(--white);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 22px;
      border: 3.5px solid rgba(255, 255, 255, 0.25);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-title {
      margin: 0;
      font-size: clamp(19px, 4vw, 23px);
      font-weight: 700;
    }

    .loading-message {
      min-height: 26px;
      margin: 10px 0 0;
      color: var(--text-muted);
      font-size: 15px;
    }

    .fallback-button {
      margin-top: 26px;
      padding: 10px 22px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 999px;
      color: var(--psu-navy);
      background: var(--white);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 160ms ease;
    }

    .fallback-button:hover {
      background: #eaf3fb;
      transform: translateY(-1px);
    }

    .fallback-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    /* iframe แสดงแอปวางซ่อนไว้ด้านหลังเพื่อรอรับสัญญาณ */
    #gas-frame {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #ffffff;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 240ms ease, visibility 240ms ease;
    }

    #gas-frame.is-ready {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
  </style>
</head>

<body>
  <!-- หน้าจอสถานะระหว่างตรวจสอบ -->
  <main id="loading-screen" role="status">
    <section class="loading-card">
      <div class="brand-mark">LAMS</div>
      <div class="spinner"></div>
      <h1 class="loading-title">ระบบสร้างโปสเตอร์แสดงความยินดี</h1>
      <p id="loading-message" class="loading-message">กำลังตรวจสอบการเชื่อมต่อ...</p>
      <button id="fallback-button" class="fallback-button" type="button">เข้าสู่ระบบ Google ม.อ. โดยตรง</button>
    </section>
  </main>

  <!-- กรอบ iframe ของ Google Apps Script -->
  <iframe
    id="gas-frame"
    title="PSU LAMS Poster System"
    src="https://script.google.com/a/macros/psu.ac.th/s/AKfycbxQCGHfNh5lvt-AuGD89apaccK1dMZ23TMsG4d5uCZO0sn4eavbk-6HCb6LClvFq8b5XQ/exec"
    allow="clipboard-read; clipboard-write">
  </iframe>

  <script>
    (() => {
      "use strict";

      const GAS_URL = "https://script.google.com/a/macros/psu.ac.th/s/AKfycbxQCGHfNh5lvt-AuGD89apaccK1dMZ23TMsG4d5uCZO0sn4eavbk-6HCb6LClvFq8b5XQ/exec";
      const HANDSHAKE_TYPE = "LAMS_FRAME_READY";
      const HANDSHAKE_TIMEOUT_MS = 3500; //เวลารอสัญญาณ (3.5 วินาที)

      const loadingScreen = document.getElementById("loading-screen");
      const loadingMessage = document.getElementById("loading-message");
      const fallbackButton = document.getElementById("fallback-button");
      const gasFrame = document.getElementById("gas-frame");

      let handshakeCompleted = false;
      let timeoutId = null;

      // รายชื่อ Origin ที่ปลอดภัยและยอมรับได้จาก Apps Script
      const allowedOrigins = new Set([
        "https://script.google.com",
        "https://script.googleusercontent.com"
      ]);

      // ฟังก์ชันเด้งไปหน้า Login เต็มจอ
      function redirectToGoogleLogin() {
        if (handshakeCompleted) return;
        handshakeCompleted = true;
        if (timeoutId) clearTimeout(timeoutId);

        fallbackButton.disabled = true;
        loadingMessage.textContent = "กำลังนำท่านไปยังหน้าเข้าสู่ระบบ Google ม.อ. ...";
        window.location.replace(GAS_URL);
      }

      // ฟังก์ชันเปิดแสดงแอปใน iframe
      function showApplication() {
        if (handshakeCompleted) return;
        handshakeCompleted = true;
        if (timeoutId) clearTimeout(timeoutId);

        gasFrame.classList.add("is-ready");
        loadingScreen.classList.add("is-hidden");
      }

      // ดักฟังข้อความลับจาก iframe
      window.addEventListener("message", (event) => {
        // ต้องส่งมาจาก iframe ของเราเท่านั้น
        if (event.source !== gasFrame.contentWindow) return;
        // ต้องมาจาก Google เท่านั้น
        if (!allowedOrigins.has(event.origin)) return;
        // ต้องมีรหัสสัญญาณตรงกัน
        if (!event.data || event.data.type !== HANDSHAKE_TYPE) return;

        showApplication();
      });

      fallbackButton.addEventListener("click", () => {
        redirectToGoogleLogin();
      });

      // หากผ่านไป 3.5 วินาทีแล้วไม่มีสัญญาณตอบรับ (ติดหน้าบล็อกล็อกอิน) ให้พาไปหน้า Login ทันที
      timeoutId = setTimeout(() => {
        if (!handshakeCompleted) {
          redirectToGoogleLogin();
        }
      }, HANDSHAKE_TIMEOUT_MS);
    })();
  </script>
</body>
</html>
