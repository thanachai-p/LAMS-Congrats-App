<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">

  <title>ระบบสร้างภาพโปสเตอร์แสดงความยินดี | PSU LAMS</title>

  <style>
    /* ล้างขอบและป้องกัน Scrollbar ซ้ำซ้อนของหน้า GitHub */
    html, body {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f8fbfe;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    /* ขยาย iframe ให้เต็มจอทั้งบน Desktop และ Mobile (รองรับ dvw/dvh) */
    .app-frame {
      display: block;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      min-width: 100%;
      min-height: 100%;
      border: 0;
      outline: 0;
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    /* แถบแจ้งเตือนสำรอง (จะลอยขึ้นมาเฉพาะกรณีที่เบราว์เซอร์บล็อก iframe) */
    .fallback-banner {
      position: fixed;
      z-index: 999;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: none;
      width: min(92vw, 480px);
      box-sizing: border-box;
      padding: 16px 20px;
      color: #17324d;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(0, 59, 112, 0.2);
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0, 59, 112, 0.2);
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .fallback-banner.is-visible {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .fallback-banner p {
      margin: 0 0 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .fallback-btn {
      display: inline-block;
      min-height: 40px;
      padding: 9px 20px;
      color: #ffffff;
      background: #003b70;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 150ms ease;
    }

    .fallback-btn:hover {
      background: #0057a8;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>

<body>
  <!-- ฝัง Web App GAS แบบเต็มจอ -->
  <iframe
    id="appFrame"
    class="app-frame"
    title="PSU LAMS Congratulatory Poster System"
    src="https://script.google.com/a/macros/psu.ac.th/s/AKfycbxQCGHfNh5lvt-AuGD89apaccK1dMZ23TMsG4d5uCZO0sn4eavbk-6HCb6LClvFq8b5XQ/exec"
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>

  <!-- ปุ่มสำรองอัตโนมัติ (จะโชว์ขึ้นมาเมื่อโหลดนานเกิน 8 วินาที เช่น ติดหน้าบล็อกล็อกอิน) -->
  <div id="fallbackBanner" class="fallback-banner" role="alert">
    <p>
      ⚠️ <strong>หากหน้าจอว่างเปล่าหรือไม่โหลด:</strong><br>
      กรุณาเข้าสู่ระบบด้วยอีเมล <code>@psu.ac.th</code> ในเบราว์เซอร์นี้ หรือคลิกเปิดระบบโดยตรง
    </p>
    <a
      class="fallback-btn"
      href="https://script.google.com/a/macros/psu.ac.th/s/AKfycbxQCGHfNh5lvt-AuGD89apaccK1dMZ23TMsG4d5uCZO0sn4eavbk-6HCb6LClvFq8b5XQ/exec"
      target="_blank"
      rel="noopener noreferrer">
      เปิดระบบโดยตรง (เปิดแท็บใหม่)
    </a>
  </div>

  <script>
    (() => {
      "use strict";

      const iframe = document.getElementById("appFrame");
      const fallback = document.getElementById("fallbackBanner");
      let loaded = false;

      iframe.addEventListener("load", () => {
        loaded = true;
        fallback.classList.remove("is-visible");
      });

      // หากผ่านไป 8 วินาทีแล้ว iframe ยังโหลดไม่สำเร็จ (เช่น ติด Third-Party Cookie หรือติดหน้าล็อกอิน) ให้แสดงปุ่มสำรอง
      setTimeout(() => {
        if (!loaded) {
          fallback.classList.add("is-visible");
        }
      }, 8000);
    })();
  </script>
</body>
</html>
