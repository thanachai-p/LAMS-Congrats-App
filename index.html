<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบสร้างโปสเตอร์แสดงความยินดี | PSU LAMS</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fbfbfb;
      color: #333333;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* กล่องข้อความโหลดแบบเรียบง่ายตรงกลางจอ */
    .loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .loading-text {
      font-size: 16px;
      color: #555555;
      margin: 0;
      letter-spacing: 0.5px;
    }

    /* กรอบแอป iframe ซ่อนไว้ก่อนจนกว่าจะได้รับสัญญาณ */
    .app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #ffffff;
    }
  </style>
</head>

<body>
  <!-- ข้อความเรียบง่ายขณะรอตรวจสอบ -->
  <div id="loading" class="loading-container" role="status">
    <p class="loading-text">กำลังเข้าสู่ระบบ...</p>
  </div>

  <!-- กรอบแอป GAS -->
  <iframe
    id="appFrame"
    class="app-frame"
    title="ระบบสร้างโปสเตอร์ LAMS"
    src="https://script.google.com/a/macros/psu.ac.th/s/AKfycbxQCGHfNh5lvt-AuGD89apaccK1dMZ23TMsG4d5uCZO0sn4eavbk-6HCb6LClvFq8b5XQ/exec"
    allow="clipboard-read; clipboard-write">
  </iframe>

  <script>
    (() => {
      const GAS_URL = "https://script.google.com/a/macros/psu.ac.th/s/AKfycbxQCGHfNh5lvt-AuGD89apaccK1dMZ23TMsG4d5uCZO0sn4eavbk-6HCb6LClvFq8b5XQ/exec";

      const ALLOWED_ORIGINS = new Set([
        "https://script.google.com",
        "https://script.googleusercontent.com"
      ]);

      const frame = document.getElementById("appFrame");
      const loading = document.getElementById("loading");

      let handshakeReceived = false;

      function handleMessage(event) {
        const isValidOrigin = ALLOWED_ORIGINS.has(event.origin);
        const isValidSource = event.source === frame.contentWindow;
        const isValidMessage = event.data === "LAMS_FRAME_READY" || (event.data && event.data.type === "LAMS_FRAME_READY");

        if (!isValidOrigin || !isValidSource || !isValidMessage) {
          return;
        }

        handshakeReceived = true;
        clearTimeout(fallbackTimer);

        // เมื่อยืนยันว่าเข้าสู่ระบบแล้ว ให้ซ่อนข้อความแล้วเปิด iframe เต็มจอทันที
        loading.style.display = "none";
        frame.style.display = "block";

        window.removeEventListener("message", handleMessage);
      }

      window.addEventListener("message", handleMessage);

      // หากผ่านไป 3.5 วินาทีแล้วไม่มีสัญญาณตอบรับ (ยังไม่ได้ล็อกอิน / ติดหน้าบึ้ง) ให้ดีดไปหน้า Login เต็มจออัตโนมัติ
      const fallbackTimer = setTimeout(() => {
        if (!handshakeReceived) {
          window.location.replace(GAS_URL);
        }
      }, 3500);
    })();
  </script>
</body>
</html>
